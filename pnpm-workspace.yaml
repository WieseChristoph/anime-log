allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@babel/runtime@7.26.10'
  - flatted@3.4.0 || 3.4.2
  - picomatch@2.3.2
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
  - nanoid@3.3.17
overrides:
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
